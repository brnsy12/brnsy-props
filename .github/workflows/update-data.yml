name: Update NHL prop data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch odds
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python scripts/fetch_odds.py
      - run: python scripts/process_props.py
      - name: Fetch NHL history
        run: python scripts/fetch_nhl_history.py
      - name: Build player stats
        run: python scripts/process_player_stats.py
      - name: Save public data
        run: |
          git config user.name brnsy-props-bot
          git config user.email actions@users.noreply.github.com
          git add data/props.json data/nhl_history.json data/player_stats.json
          git diff --cached --quiet || git commit -m "Update NHL props and player stats"
          git push
